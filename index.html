<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Flash Penalty Shootout 2D</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #111; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        #game-container { position: relative; width: 800px; height: 500px; background: #000; border: 4px solid #444; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        canvas { width: 100%; height: 100%; display: block; }
        .ui-panel { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); z-index: 10; }
        .hidden { display: none !important; }
        h1 { font-size: 36px; margin-bottom: 20px; color: #4CAF50; text-shadow: 0 0 10px rgba(76,175,80,0.5); text-transform: uppercase; letter-spacing: 2px; }
        .btn { padding: 12px 30px; font-size: 18px; font-weight: bold; background: #4CAF50; color: #fff; border: none; border-radius: 25px; cursor: pointer; margin: 8px; transition: all 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.3); text-transform: uppercase; }
        .btn:hover { background: #45a049; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0,0,0,0.4); }
        .btn:active { transform: translateY(0); }
        .selection-box { display: flex; gap: 20px; margin-bottom: 25px; }
        .player-select { display: flex; flex-direction: column; align-items: center; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; border: 1px solid #333; }
        .player-select h3 { margin-bottom: 10px; color: #ffeb3b; }
        select { padding: 8px 15px; font-size: 16px; background: #222; color: #fff; border: 1px solid #555; border-radius: 5px; cursor: pointer; outline: none; }
        #hud { position: absolute; top: 10px; left: 0; width: 100%; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; z-index: 5; }
        .score-card { background: rgba(0,0,0,0.7); padding: 8px 15px; border-radius: 5px; border: 1px solid rgba(255,255,255,0.2); font-weight: bold; font-size: 16px; display: flex; align-items: center; gap: 10px; }
        .dots { display: flex; gap: 5px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; background: #444; border: 1px solid #666; }
        .dot.goal { background: #4CAF50; border-color: #81C784; box-shadow: 0 0 5px #4CAF50; }
        .dot.miss { background: #F44336; border-color: #E57373; box-shadow: 0 0 5px #F44336; }
        #controls-hint { position: absolute; bottom: 10px; width: 100%; text-align: center; font-size: 14px; color: rgba(255,255,255,0.7); pointer-events: none; text-shadow: 1px 1px 2px #000; z-index: 5; }
        #power-meter-container { position: absolute; right: 20px; bottom: 50px; width: 20px; height: 150px; background: rgba(0,0,0,0.6); border: 2px solid #fff; border-radius: 10px; overflow: hidden; display: none; flex-direction: column-reverse; }
        #power-meter-fill { width: 100%; height: 0%; background: linear-gradient(to top, #4CAF50, #FFEB3B, #F44336); }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="canvas" width="800" height="500"></canvas>

        <div id="hud">
            <div class="score-card" id="team1-card">
                <span id="p1-name">BRA</span>: <span id="p1-score">0</span>
                <div class="dots" id="p1-dots"></div>
            </div>
            <div style="font-size: 20px; font-weight: bold; text-shadow: 0 2px 4px #000;" id="turn-indicator">SUA VEZ DE CHUTAR</div>
            <div class="score-card" id="team2-card">
                <span id="p2-name">ARG</span>: <span id="p2-score">0</span>
                <div class="dots" id="p2-dots"></div>
            </div>
        </div>

        <div id="power-meter-container">
            <div id="power-meter-fill"></div>
        </div>

        <div id="controls-hint">Use as setas para mover a mira | Pressione ESPAÇO para Chutar</div>

        <!-- MENU PRINCIPAL -->
        <div id="menu-screen" class="ui-panel">
            <h1>Flash Football Penalty</h1>
            <div class="selection-box">
                <div class="player-select">
                    <h3>Jogador 1</h3>
                    <select id="p1-team-select"></select>
                </div>
                <div class="player-select">
                    <h3>Jogador 2 / IA</h3>
                    <select id="p2-team-select"></select>
                </div>
            </div>
            <div style="margin-bottom: 20px;">
                <label style="font-size: 16px; cursor: pointer;">
                    <input type="checkbox" id="pvp-mode" style="transform: scale(1.3); margin-right: 8px;"> Modo 2 Jogadores (Local X1)
                </label>
            </div>
            <button class="btn" id="start-btn">INICIAR JOGO</button>
        </div>

        <!-- TELA DE FIM DE JOGO -->
        <div id="gameover-screen" class="ui-panel hidden">
            <h1 id="winner-title">BRASIL VENCEU!</h1>
            <p id="final-score" style="font-size: 24px; margin-bottom: 20px; color: #fff;"></p>
            <button class="btn" id="restart-btn">JOGAR NOVAMENTE</button>
        </div>
    </div>

    <script>
        // WEB AUDIO SYNTHESIZER
        const AudioSys = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            },
            whistle() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(2400, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1800, this.ctx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            },
            kick() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.6, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            },
            post() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, this.ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.7, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            },
            cheer() {
                if (!this.ctx) return;
                const bufferSize = this.ctx.sampleRate * 1.5;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 1000;
                filter.Q.value = 1.0;
                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.01, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.3, this.ctx.currentTime + 0.2);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 1.5);
                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start();
            },
            boo() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(90, this.ctx.currentTime + 0.8);
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.2, this.ctx.currentTime + 0.2);
                gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.8);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.8);
            }
        };

        // SELEÇÕES
        const TEAMS = {
            BRA: { name: 'Brasil', shirt: '#FFDC00', shorts: '#002776', socks: '#FFFFFF', stripes: false, keeper: '#00E676' },
            ARG: { name: 'Argentina', shirt: '#75AADB', shorts: '#000000', socks: '#FFFFFF', stripes: true, stripeColor: '#FFFFFF', keeper: '#FF9800' },
            FRA: { name: 'França', shirt: '#002395', shorts: '#FFFFFF', socks: '#ED2939', stripes: false, keeper: '#FFEB3B' },
            GER: { name: 'Alemanha', shirt: '#FFFFFF', shorts: '#000000', socks: '#FFFFFF', stripes: false, keeper: '#ED2939' },
            ESP: { name: 'Espanha', shirt: '#AA151B', shorts: '#002B45', socks: '#F1BF00', stripes: false, keeper: '#00BCD4' },
            POR: { name: 'Portugal', shirt: '#FF0000', shorts: '#006600', socks: '#FF0000', stripes: false, keeper: '#9C27B0' },
            ENG: { name: 'Inglaterra', shirt: '#FFFFFF', shorts: '#000080', socks: '#FFFFFF', stripes: false, keeper: '#FF5722' },
            ITA: { name: 'Itália', shirt: '#004687', shorts: '#FFFFFF', socks: '#004687', stripes: false, keeper: '#FFC107' }
        };

        // CONFIGURAÇÕES DO CANVAS E JOGO
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Geometria da trave
        const GOAL = {
            x: 200,
            y: 110,
            w: 400,
            h: 150,
            postWidth: 12
        };

        // Estado do Jogo
        let gameState = 'MENU'; // MENU, AIMING, POWERING, KICKING, RESULT, GAMEOVER
        let isPvP = false;
        let p1Team = 'BRA';
        let p2Team = 'ARG';
        let currentTurn = 1; // 1 ou 2
        let round = 1;
        let maxRounds = 5;

        let p1Score = 0;
        let p2Score = 0;
        let p1History = [];
        let p2History = [];

        // Mira
        let target = { x: 400, y: 185 };
        const AIM_BOUNDS = { minX: 210, maxX: 590, minY: 120, maxY: 250 };
        let aimKeys = { left: false, right: false, up: false, down: false };

        // Força
        let power = 0;
        let powerDir = 1;

        // Bola
        let ball = {
            x: 400,
            y: 410,
            z: 0,
            vx: 0,
            vy: 0,
            vz: 0,
            startX: 400,
            startY: 410,
            radius: 12,
            curve: 0,
            rotation: 0
        };

        // Goleiro
        let keeper = {
            x: 400,
            y: 245,
            vx: 0,
            vy: 0,
            targetX: 400,
            targetY: 245,
            state: 'IDLE', // IDLE, DIVING, RECOVER
            animTime: 0,
            gloveLeft: { x: 380, y: 220 },
            gloveRight: { x: 420, y: 220 }
        };

        // Cobrador
        let kicker = {
            x: 400,
            y: 450,
            state: 'IDLE', // IDLE, RUNNING, KICKED
            animFrame: 0,
            legAngle: 0
        };

        // Animação e Efeitos de Torcida / Flares
        let crowdFlashes = [];
        let netOffset = [];
        for(let i=0; i<20; i++) {
            netOffset.push({x: 0, y: 0, vx: 0, vy: 0});
        }

        // INICIALIZAÇÃO CONTROLES E OPÇÕES
        const p1Select = document.getElementById('p1-team-select');
        const p2Select = document.getElementById('p2-team-select');

        Object.keys(TEAMS).forEach(key => {
            p1Select.innerHTML += `<option value="${key}">${TEAMS[key].name}</option>`;
            p2Select.innerHTML += `<option value="${key}">${TEAMS[key].name}</option>`;
        });
        p1Select.value = 'BRA';
        p2Select.value = 'ARG';

        // Listeners de Teclado
        window.addEventListener('keydown', e => {
            AudioSys.init();
            if (e.key === 'ArrowLeft') aimKeys.left = true;
            if (e.key === 'ArrowRight') aimKeys.right = true;
            if (e.key === 'ArrowUp') aimKeys.up = true;
            if (e.key === 'ArrowDown') aimKeys.down = true;

            if (e.code === 'Space') {
                if (gameState === 'AIMING') {
                    gameState = 'POWERING';
                    document.getElementById('power-meter-container').style.display = 'flex';
                } else if (gameState === 'POWERING') {
                    executeKick();
                }
            }
        });

        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowLeft') aimKeys.left = false;
            if (e.key === 'ArrowRight') aimKeys.right = false;
            if (e.key === 'ArrowUp') aimKeys.up = false;
            if (e.key === 'ArrowDown') aimKeys.down = false;
        });

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);

        function startGame() {
            p1Team = p1Select.value;
            p2Team = p2Select.value;
            isPvP = document.getElementById('pvp-mode').checked;

            document.getElementById('p1-name').innerText = p1Team;
            document.getElementById('p2-name').innerText = p2Team;

            p1Score = 0;
            p2Score = 0;
            p1History = [];
            p2History = [];
            round = 1;
            currentTurn = 1;

            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('gameover-screen').classList.add('hidden');

            updateHUD();
            resetTurn();
            gameState = 'AIMING';
        }

        function resetTurn() {
            target = { x: 400, y: 185 };
            power = 0;
            powerDir = 1;

            ball.x = 400;
            ball.y = 410;
            ball.z = 0;
            ball.vx = 0;
            ball.vy = 0;
            ball.vz = 0;

            keeper.x = 400;
            keeper.y = 245;
            keeper.vx = 0;
            keeper.vy = 0;
            keeper.state = 'IDLE';

            kicker.x = 360;
            kicker.y = 450;
            kicker.state = 'IDLE';

            document.getElementById('power-meter-container').style.display = 'none';
            document.getElementById('power-meter-fill').style.height = '0%';

            const isP1 = currentTurn === 1;
            const attackingTeam = isP1 ? TEAMS[p1Team].name : TEAMS[p2Team].name;
            const isAI = (!isPvP && currentTurn === 2);

            document.getElementById('turn-indicator').innerText = isAI ? `VEZ DE ${attackingTeam.toUpperCase()} (IA)` : `COBRANÇA: ${attackingTeam.toUpperCase()}`;

            if (isAI) {
                // IA decide o chute
                setTimeout(() => {
                    target.x = AIM_BOUNDS.minX + Math.random() * (AIM_BOUNDS.maxX - AIM_BOUNDS.minX);
                    target.y = AIM_BOUNDS.minY + Math.random() * (AIM_BOUNDS.maxY - AIM_BOUNDS.minY);
                    power = 40 + Math.random() * 50;
                    executeKick();
                }, 1200);
            }
        }

        function executeKick() {
            gameState = 'KICKING';
            document.getElementById('power-meter-container').style.display = 'none';

            kicker.state = 'RUNNING';

            // Decisão do Goleiro (IA ou Defesas)
            let keeperTargetX = 400;
            let keeperTargetY = 245;

            // Chance de acertar o lado baseada em aleatoriedade / tempo
            const diveSides = [GOAL.x + 50, GOAL.x + 100, 400, GOAL.x + GOAL.w - 100, GOAL.x + GOAL.w - 50];
            const diveHeights = [170, 245];

            keeperTargetX = diveSides[Math.floor(Math.random() * diveSides.length)];
            keeperTargetY = diveHeights[Math.floor(Math.random() * diveHeights.length)];

            // Se for chute fraco/medio, aumentar chance de o goleiro pular na direção certa
            if (Math.random() < 0.45) {
                keeperTargetX = target.x + (Math.random() - 0.5) * 60;
            }

            keeper.targetX = keeperTargetX;
            keeper.targetY = keeperTargetY;

            // Animação de corrida antes de bater na bola
            setTimeout(() => {
                AudioSys.kick();
                kicker.state = 'KICKED';

                // Física do chute 3D
                const dx = target.x - ball.x;
                const dy = target.y - ball.y;
                const dist = Math.hypot(dx, dy);

                const speed = 12 + (power / 100) * 12;
                ball.vx = (dx / dist) * speed;
                ball.vy = (dy / dist) * speed;
                ball.vz = (250 - target.y) * 0.05 + (power / 100) * 2; // Elevação Z

                // Goleiro Inicia o Salto
                keeper.state = 'DIVING';
                keeper.vx = (keeper.targetX - keeper.x) * 0.08;
                keeper.vy = (keeper.targetY - keeper.y) * 0.08;

            }, 400);
        }

        function updateHUD() {
            document.getElementById('p1-score').innerText = p1Score;
            document.getElementById('p2-score').innerText = p2Score;

            let h1 = '';
            for(let i=0; i<maxRounds; i++) {
                if(i < p1History.length) {
                    h1 += `<div class="dot ${p1History[i] ? 'goal' : 'miss'}"></div>`;
                } else {
                    h1 += `<div class="dot"></div>`;
                }
            }
            document.getElementById('p1-dots').innerHTML = h1;

            let h2 = '';
            for(let i=0; i<maxRounds; i++) {
                if(i < p2History.length) {
                    h2 += `<div class="dot ${p2History[i] ? 'goal' : 'miss'}"></div>`;
                } else {
                    h2 += `<div class="dot"></div>`;
                }
            }
            document.getElementById('p2-dots').innerHTML = h2;
        }

        // UPDATE PRINCIPAL DO JOGO
        function update() {
            // Atualizar Mira
            if (gameState === 'AIMING') {
                const speed = 4;
                if (aimKeys.left && target.x > AIM_BOUNDS.minX) target.x -= speed;
                if (aimKeys.right && target.x < AIM_BOUNDS.maxX) target.x += speed;
                if (aimKeys.up && target.y > AIM_BOUNDS.minY) target.y -= speed;
                if (aimKeys.down && target.y < AIM_BOUNDS.maxY) target.y += speed;
            }

            // Atualizar Barra de Força
            if (gameState === 'POWERING') {
                power += powerDir * 3;
                if (power >= 100) { power = 100; powerDir = -1; }
                if (power <= 0) { power = 0; powerDir = 1; }
                document.getElementById('power-meter-fill').style.height = power + '%';
            }

            // Atualizar Movimento do Goleiro
            if (keeper.state === 'DIVING') {
                keeper.x += keeper.vx;
                keeper.y += keeper.vy;
                keeper.gloveLeft = { x: keeper.x - 35, y: keeper.y - 10 };
                keeper.gloveRight = { x: keeper.x + 35, y: keeper.y - 10 };
            }

            // Atualizar Movimento da Bola
            if (gameState === 'KICKING') {
                ball.x += ball.vx;
                ball.y += ball.vy;
                ball.z += ball.vz;
                ball.rotation += 0.2;

                // Colisão com Luvas do Goleiro
                const distGloveL = Math.hypot(ball.x - keeper.gloveLeft.x, ball.y - keeper.gloveLeft.y);
                const distGloveR = Math.hypot(ball.x - keeper.gloveRight.x, ball.y - keeper.gloveRight.y);
                const distBody = Math.hypot(ball.x - keeper.x, ball.y - keeper.y);

                if (distGloveL < 30 || distGloveR < 30 || (distBody < 35 && ball.y < 260)) {
                    // DEFESA!
                    AudioSys.post();
                    ball.vx = (Math.random() - 0.5) * 8;
                    ball.vy = 4;
                    ball.vz = -2;
                    processResult(false);
                }

                // Checar Linha do Gol / Traves
                if (ball.y <= GOAL.y + GOAL.h) {
                    // Colisão Trave Esquerda / Direita / Travessão
                    const inGoalX = ball.x > GOAL.x + GOAL.postWidth && ball.x < GOAL.x + GOAL.w - GOAL.postWidth;
                    const inGoalY = ball.y > GOAL.y && ball.y < GOAL.y + GOAL.h;

                    if (inGoalX && inGoalY) {
                        // GOL!
                        AudioSys.cheer();
                        // Deformar rede
                        const netIndex = Math.floor(((ball.x - GOAL.x) / GOAL.w) * netOffset.length);
                        if (netOffset[netIndex]) netOffset[netIndex].y = 15;
                        processResult(true);
                    } else if (ball.y <= GOAL.y + GOAL.h + 20) {
                        // FORA OU TRAVE
                        if (Math.abs(ball.x - GOAL.x) < 20 || Math.abs(ball.x - (GOAL.x + GOAL.w)) < 20 || Math.abs(ball.y - GOAL.y) < 20) {
                            AudioSys.post();
                            ball.vx *= -0.5;
                            ball.vy = 3;
                        } else {
                            AudioSys.boo();
                        }
                        processResult(false);
                    }
                }
            }

            // Recuperação das molas da rede
            netOffset.forEach(n => {
                n.y *= 0.9;
            });

            // Flashes da Torcida
            if (Math.random() < 0.1) {
                crowdFlashes.push({
                    x: Math.random() * canvas.width,
                    y: 30 + Math.random() * 70,
                    alpha: 1
                });
            }
            crowdFlashes.forEach((f, index) => {
                f.alpha -= 0.1;
                if (f.alpha <= 0) crowdFlashes.splice(index, 1);
            });
        }

        function processResult(isGoal) {
            gameState = 'RESULT';
            if (currentTurn === 1) {
                if (isGoal) p1Score++;
                p1History.push(isGoal);
            } else {
                if (isGoal) p2Score++;
                p2History.push(isGoal);
            }

            updateHUD();

            setTimeout(() => {
                // Checar Fim de Jogo ou Próximo Turno
                if (currentTurn === 1) {
                    currentTurn = 2;
                } else {
                    currentTurn = 1;
                    round++;
                }

                // Verificar Condições de Vitória
                const roundsLeftP1 = maxRounds - p1History.length;
                const roundsLeftP2 = maxRounds - p2History.length;

                if (p1History.length >= maxRounds && p2History.length >= maxRounds) {
                    if (p1Score !== p2Score) {
                        endGame();
                        return;
                    } else {
                        // Morte Súdita
                        maxRounds++;
                    }
                } else if (p1Score > p2Score + roundsLeftP2 || p2Score > p1Score + roundsLeftP1) {
                    endGame();
                    return;
                }

                resetTurn();
                gameState = 'AIMING';
            , 2000);
        }

        function endGame() {
            gameState = 'GAMEOVER';
            const winnerText = p1Score > p2Score ? `${TEAMS[p1Team].name.toUpperCase()} VENCEU!` : `${TEAMS[p2Team].name.toUpperCase()} VENCEU!`;
            document.getElementById('winner-title').innerText = winnerText;
            document.getElementById('final-score').innerText = `Placar Final: ${p1Score} x ${p2Score}`;
            document.getElementById('gameover-screen').classList.remove('hidden');
        }

        // DESENHO (RENDER) EM CANVAS 2D ESTILO FLASH CLASSIC
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Céu e Estádio
            ctx.fillStyle = '#1a2634';
            ctx.fillRect(0, 0, canvas.width, 100);

            // Arquibancada com Torcida Sintética
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(0, 50, canvas.width, 50);
            for(let i=0; i<canvas.width; i+=8) {
                for(let j=50; j<100; j+=8) {
                    ctx.fillStyle = (i + j) % 3 === 0 ? '#e74c3c' : (i + j) % 2 === 0 ? '#3498db' : '#f1c40f';
                    ctx.fillRect(i, j, 6, 6);
                }
            }

            // Flashes de Câmera da Torcida
            crowdFlashes.forEach(f => {
                ctx.fillStyle = `rgba(255, 255, 255, ${f.alpha})`;
                ctx.beginPath();
                ctx.arc(f.x, f.y, 4, 0, Math.PI * 2);
                ctx.fill();
            });

            // 2. Gramado Retrô (Linhas Horizontais estilo Flash Classic)
            const stripeHeight = 25;
            for (let y = 100; y < canvas.height; y += stripeHeight) {
                ctx.fillStyle = (Math.floor(y / stripeHeight) % 2 === 0) ? '#4CAF50' : '#43A047';
                ctx.fillRect(0, y, canvas.width, stripeHeight);
            }

            // Linhas de Demarcação do Campo
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.lineWidth = 4;
            // Linha da Grande Área
            ctx.beginPath();
            ctx.moveTo(100, 260);
            ctx.lineTo(700, 260);
            ctx.stroke();

            // Linha de Fundo
            ctx.beginPath();
            ctx.moveTo(0, 260);
            ctx.lineTo(canvas.width, 260);
            ctx.stroke();

            // Marca do Pênalti
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(400, 410, 4, 0, Math.PI * 2);
            ctx.fill();

            // 3. Trave e Rede 2D
            // Desenho da Rede
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 1;
            const netCols = 20;
            const netRows = 10;
            const colW = GOAL.w / netCols;
            const rowH = GOAL.h / netRows;

            for(let r = 0; r <= netRows; r++) {
                ctx.beginPath();
                for(let c = 0; c <= netCols; c++) {
                    const offset = netOffset[c] ? netOffset[c].y : 0;
                    const nx = GOAL.x + c * colW;
                    const ny = GOAL.y + r * rowH + (r > 0 ? offset : 0);
                    if (c === 0) ctx.moveTo(nx, ny);
                    else ctx.lineTo(nx, ny);
                }
                ctx.stroke();
            }
            for(let c = 0; c <= netCols; c++) {
                ctx.beginPath();
                const offset = netOffset[c] ? netOffset[c].y : 0;
                ctx.moveTo(GOAL.x + c * colW, GOAL.y);
                ctx.lineTo(GOAL.x + c * colW, GOAL.y + GOAL.h + offset);
                ctx.stroke();
            }

            // Estrutura Branca da Trave (Postes e Travessão)
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = GOAL.postWidth;
            ctx.lineJoin = 'miter';
            ctx.beginPath();
            ctx.moveTo(GOAL.x, GOAL.y + GOAL.h);
            ctx.lineTo(GOAL.x, GOAL.y);
            ctx.lineTo(GOAL.x + GOAL.w, GOAL.y);
            ctx.lineTo(GOAL.x + GOAL.w, GOAL.y + GOAL.h);
            ctx.stroke();

            // Sombra dos Postes
            ctx.strokeStyle = 'rgba(0,0,0,0.2)';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(GOAL.x + 6, GOAL.y + GOAL.h);
            ctx.lineTo(GOAL.x + 6, GOAL.y + 6);
            ctx.lineTo(GOAL.x + GOAL.w - 6, GOAL.y + 6);
            ctx.stroke();

            // 4. Desenhar Goleiro (Com Anatomia e Luvas)
            drawKeeper();

            // 5. Mira Clássica Verde Flash com Setas
            if (gameState === 'AIMING' || gameState === 'POWERING') {
                drawClassicAim(target.x, target.y);
            }

            // 6. Desenhar Cobrador (Visto de Costas com Número na Camisa)
            drawKicker();

            // 7. Desenhar Bola com Rotação e Sombra 2.5D
            drawBall();
        }

        // MIRA VERDE CLÁSSICA FLASH COM SETAS
        function drawClassicAim(x, y) {
            ctx.save();
            ctx.translate(x, y);

            // Círculo Verde Central Interno
            ctx.fillStyle = 'rgba(76, 175, 80, 0.6)';
            ctx.beginPath();
            ctx.arc(0, 0, 16, 0, Math.PI * 2);
            ctx.fill();

            // Borda Verde Externa
            ctx.strokeStyle = '#4CAF50';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 0, 16, 0, Math.PI * 2);
            ctx.stroke();

            // Setas Brancas Indicadoras (Cima, Baixo, Esquerda, Direita)
            ctx.fillStyle = '#FFFFFF';
            const arrowDist = 22;
            const size = 6;

            // Seta Cima
            ctx.beginPath();
            ctx.moveTo(0, -arrowDist);
            ctx.lineTo(-size, -arrowDist - size);
            ctx.lineTo(size, -arrowDist - size);
            ctx.fill();

            // Seta Baixo
            ctx.beginPath();
            ctx.moveTo(0, arrowDist);
            ctx.lineTo(-size, arrowDist + size);
            ctx.lineTo(size, arrowDist + size);
            ctx.fill();

            // Seta Esquerda
            ctx.beginPath();
            ctx.moveTo(-arrowDist, 0);
            ctx.lineTo(-arrowDist - size, -size);
            ctx.lineTo(-arrowDist - size, size);
            ctx.fill();

            // Seta Direita
            ctx.beginPath();
            ctx.moveTo(arrowDist, 0);
            ctx.lineTo(arrowDist + size, -size);
            ctx.lineTo(arrowDist + size, size);
            ctx.fill();

            ctx.restore();
        }

        // DESENHO DO GOLEIRO
        function drawKeeper() {
            const teamKey = currentTurn === 1 ? p2Team : p1Team;
            const team = TEAMS[teamKey];

            ctx.save();
            ctx.translate(keeper.x, keeper.y);

            // Sombra
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(0, 20, 20, 6, 0, 0, Math.PI * 2);
            ctx.fill();

            // Pernas
            ctx.fillStyle = team.shorts;
            ctx.fillRect(-12, 0, 8, 16);
            ctx.fillRect(4, 0, 8, 16);

            // Meias / Chuteiras
            ctx.fillStyle = team.socks;
            ctx.fillRect(-12, 16, 8, 10);
            ctx.fillRect(4, 16, 8, 10);

            // Tronco (Camisa do Goleiro)
            ctx.fillStyle = team.keeper;
            ctx.fillRect(-15, -25, 30, 25);

            // Cabeça
            ctx.fillStyle = '#ffcc99';
            ctx.beginPath();
            ctx.arc(0, -32, 8, 0, Math.PI * 2);
            ctx.fill();

            // Cabelo
            ctx.fillStyle = '#4a2e00';
            ctx.beginPath();
            ctx.arc(0, -35, 8, Math.PI, Math.PI * 2);
            ctx.fill();

            // Braços e Luvas
            ctx.fillStyle = team.keeper;
            if (keeper.state === 'DIVING') {
                // Braços Esticados no Salto
                ctx.fillRect(-28, -25, 14, 8);
                ctx.fillRect(14, -25, 14, 8);

                // Luvas Grandes
                ctx.fillStyle = '#FFFFFF';
                ctx.beginPath();
                ctx.arc(-32, -21, 7, 0, Math.PI * 2);
                ctx.arc(32, -21, 7, 0, Math.PI * 2);
                ctx.fill();
            } else {
                // Postura Normal de Espera
                ctx.fillRect(-22, -20, 8, 15);
                ctx.fillRect(14, -20, 8, 15);

                // Luvas
                ctx.fillStyle = '#FFFFFF';
                ctx.beginPath();
                ctx.arc(-18, -2, 6, 0, Math.PI * 2);
                ctx.arc(18, -2, 6, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        // DESENHO DO COBRADOR (COSTAS COM NÚMERO)
        function drawKicker() {
            const teamKey = currentTurn === 1 ? p1Team : p2Team;
            const team = TEAMS[teamKey];

            ctx.save();
            ctx.translate(kicker.x, kicker.y);

            // Sombra no Chão
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(0, 15, 18, 6, 0, 0, Math.PI * 2);
            ctx.fill();

            // Pernas
            ctx.fillStyle = team.shorts;
            ctx.fillRect(-10, -10, 8, 16);
            ctx.fillRect(2, -10, 8, 16);

            // Chuteiras
            ctx.fillStyle = '#111';
            ctx.fillRect(-10, 6, 8, 8);
            ctx.fillRect(2, 6, 8, 8);

            // Camisa (Costas)
            ctx.fillStyle = team.shirt;
            ctx.fillRect(-14, -40, 28, 30);

            // Listras se houver (Ex: Argentina)
            if (team.stripes) {
                ctx.fillStyle = team.stripeColor;
                ctx.fillRect(-10, -40, 6, 30);
                ctx.fillRect(4, -40, 6, 30);
            }

            // NÚMERO NAS COSTAS (Estilo Clássico)
            ctx.fillStyle = team.shirt === '#FFFFFF' ? '#000000' : '#FFFFFF';
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('10', 0, -20);

            // Cabeça (Visto de Costas)
            ctx.fillStyle = '#4a2e00';
            ctx.beginPath();
            ctx.arc(0, -46, 9, 0, Math.PI * 2);
            ctx.fill();

            // Braços
            ctx.fillStyle = team.shirt;
            ctx.fillRect(-20, -38, 7, 18);
            ctx.fillRect(13, -38, 7, 18);

            // Mãos
            ctx.fillStyle = '#ffcc99';
            ctx.beginPath();
            ctx.arc(-16.5, -18, 4, 0, Math.PI * 2);
            ctx.arc(16.5, -18, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        // DESENHO DA BOLA
        function drawBall() {
            ctx.save();
            const currentRadius = Math.max(5, ball.radius - (ball.y < 260 ? (410 - ball.y) * 0.015 : 0));

            // Sombra Projetada no Chão
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(ball.x, ball.y + currentRadius - 2, currentRadius, currentRadius * 0.4, 0, 0, Math.PI * 2);
            ctx.fill();

            // Corpo da Bola (Com Elevação Z)
            const drawY = ball.y - ball.z;
            ctx.translate(ball.x, drawY);
            ctx.rotate(ball.rotation);

            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.arc(0, 0, currentRadius, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Gomos Pretos da Bola Tradicional
            ctx.fillStyle = '#000000';
            for (let i = 0; i < 5; i++) {
                const angle = (i * Math.PI * 2) / 5;
                const gx = Math.cos(angle) * (currentRadius * 0.5);
                const gy = Math.sin(angle) * (currentRadius * 0.5);
                ctx.beginPath();
                ctx.arc(gx, gy, currentRadius * 0.25, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        // LOOP PRINCIPAL DO JOGO
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Iniciar Loop
        gameLoop();
    </script>
