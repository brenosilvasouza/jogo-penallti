<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disputa de Pênaltis: Brasil vs Argentina</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      color: white;
      background: #10251b;
      user-select: none;
    }

    h1 { color: #ffe45c; margin-top: 15px; }

    #screen-select, #game-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 10px;
    }

    .team-btn {
      padding: 15px 30px;
      font-size: 18px;
      margin: 10px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .btn-br { background: #ffe45c; color: #000; }
    .btn-arg { background: #74acdf; color: #fff; }

    #campo {
      position: relative;
      width: 100%;
      height: 320px;
      background: linear-gradient(to bottom, #1d7a3e 0%, #176332 100%);
      border: 3px solid white;
      border-radius: 10px;
      margin: 15px auto;
      overflow: hidden;
      cursor: crosshair;
    }

    #baliza {
      position: absolute;
      top: 20px;
      left: 15%;
      width: 70%;
      height: 120px;
      border: 4px solid white;
      border-bottom: none;
      background: rgba(255, 255, 255, 0.15);
    }

    #goleiro {
      position: absolute;
      top: 80px;
      left: calc(50% - 25px);
      width: 50px;
      height: 25px;
      font-size: 24px;
      transition: all 0.4s ease;
    }

    #bola {
      position: absolute;
      bottom: 20px;
      left: calc(50% - 12px);
      width: 24px;
      height: 24px;
      font-size: 20px;
      transition: all 0.5s ease;
    }

    /* Barra de Força */
    #power-box {
      width: 80%;
      height: 20px;
      background: #333;
      border: 2px solid #fff;
      margin: 10px auto;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    #power-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(to right, green, yellow, red);
    }

    .btn-action {
      background: #ffe45c;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>⚽ DISPUTA DE PÊNALTIS</h1>

  <!-- TELA DE SELEÇÃO DE TIME -->
  <div id="screen-select">
    <h2>Escolha a sua Seleção:</h2>
    <button class="team-btn btn-br" onclick="selectTeam('Brasil')">🇧🇷 BRASIL</button>
    <button class="team-btn btn-arg" onclick="selectTeam('Argentina')">🇦🇷 ARGENTINA</button>
  </div>

  <!-- TELA DO JOGO -->
  <div id="game-container" style="display: none;">
    <h3 id="info-placar">Você: 0 | Adversário: 0</h3>
    <h4 id="info-turno">Sua vez de BATER!</h4>

    <div id="campo" onclick="handleClickCampo(event)">
      <div id="baliza"></div>
      <div id="goleiro">🧤</div>
      <div id="bola">⚽</div>
    </div>

    <!-- Barra de Medição de Força -->
    <p id="label-forca">Aguarde a mira...</p>
    <div id="power-box">
      <div id="power-bar"></div>
    </div>

    <button id="btn-restart" class="btn-action" style="display:none;" onclick="restartGame()">Jogar Novamente</button>
  </div>

  <script>
    let playerTeam = '';
    let cpuTeam = '';
    let playerScore = 0;
    let cpuScore = 0;
    let round = 1;
    let maxRounds = 5;
    let mode = 'SHOOT'; // 'SHOOT' ou 'DEFEND'
    
    let power = 0;
    let powerIncreasing = true;
    let powerInterval = null;
    let targetX = 0, targetY = 0;
    let canAction = false;

    function selectTeam(team) {
      playerTeam = team;
      cpuTeam = team === 'Brasil' ? 'Argentina' : 'Brasil';
      document.getElementById('screen-select').style.display = 'none';
      document.getElementById('game-container').style.display = 'block';
      startTurn();
    }

    function updateUI() {
      document.getElementById('info-placar').innerText = `${playerTeam}: ${playerScore} | ${cpuTeam}: ${cpuScore} (Rodada ${round}/${maxRounds})`;
    }

    function startTurn() {
      updateUI();
      resetPositions();

      if (round > maxRounds) {
        endGame();
        return;
      }

      if (mode === 'SHOOT') {
        document.getElementById('info-turno').innerText = `Sua vez de BATER com o ${playerTeam}! Clique na baliza.`;
        document.getElementById('label-forca').innerText = '1. Clique na baliza para apontar. 2. Clique de novo para fixar a força!';
        canAction = true;
      } else {
        document.getElementById('info-turno').innerText = `Sua vez de DEFENDER com o ${playerTeam}! Clique onde acha que a bola vai.`;
        document.getElementById('label-forca').innerText = 'Clique na baliza para posicionar as luvas do goleiro!';
        canAction = true;
      }
    }

    function resetPositions() {
      const bola = document.getElementById('bola');
      const goleiro = document.getElementById('goleiro');
      
      bola.style.transition = 'all 0.5s ease';
      bola.style.bottom = '20px';
      bola.style.left = 'calc(50% - 12px)';

      goleiro.style.left = 'calc(50% - 25px)';
      goleiro.style.top = '80px';

      clearInterval(powerInterval);
      power = 0;
      document.getElementById('power-bar').style.width = '0%';
    }

    function startPowerMeter() {
      powerInterval = setInterval(() => {
        if (powerIncreasing) {
          power += 4;
          if (power >= 100) powerIncreasing = false;
        } else {
          power -= 4;
          if (power <= 0) powerIncreasing = true;
        }
        document.getElementById('power-bar').style.width = power + '%';
      }, 30);
    }

    function handleClickCampo(event) {
      if (!canAction) return;

      const campo = document.getElementById('campo');
      const rect = campo.getBoundingClientRect();
      const clickX = event.clientX - rect.left;
      const clickY = event.clientY - rect.top;

      if (mode === 'SHOOT') {
        if (!powerInterval) {
          // Passo 1: Guardar mira e iniciar medidor de força
          targetX = clickX;
          targetY = clickY;
          startPowerMeter();
          document.getElementById('label-forca').innerText = 'Clique novamente para CHUTAR!';
        } else {
          // Passo 2: Confirmar força e realizar chute
          clearInterval(powerInterval);
          canAction = false;
          executePlayerShot();
        }
      } else if (mode === 'DEFEND') {
        // Modo Defesa
        canAction = false;
        executePlayerDefense(clickX, clickY);
      }
    }

    function executePlayerShot() {
      const bola = document.getElementById('bola');
      const goleiro = document.getElementById('goleiro');

      // Animação da bola
      bola.style.left = (targetX - 12) + 'px';
      bola.style.top = targetY + 'px';

      // Movimento do Goleiro CPU (Escolha aleatória)
      const options = [20, 50, 80]; // Porcentagens na baliza
      const cpuMovePercent = options[Math.floor(Math.random() * options.length)];
      goleiro.style.left = `calc(${cpuMovePercent}% - 25px)`;

      setTimeout(() => {
        // Verificar se foi Gol ou Defesa
        const isGoal = Math.abs(power - 70) < 30 && Math.abs((targetX / 600 * 100) - cpuMovePercent) > 15;
        
        if (isGoal) {
          playerScore++;
          alert('GOL DA SUA SELEÇÃO! ⚽');
        } else {
          alert('DEFENDEU O GOLEIRO / CHUTE PARA FORA! ❌');
        }

        mode = 'DEFEND';
        startTurn();
      }, 600);
    }

    function executePlayerDefense(defX, defY) {
      const goleiro = document.getElementById('goleiro');
      const bola = document.getElementById('bola');

      // Mover goleiro para o clique do jogador
      goleiro.style.left = (defX - 25) + 'px';
      goleiro.style.top = (defY - 12) + 'px';

      // Chute da CPU aleatório
      const cpuTargetX = Math.random() * 300 + 150; // Área da baliza
      const cpuTargetY = Math.random() * 80 + 30;

      bola.style.left = cpuTargetX + 'px';
      bola.style.top = cpuTargetY + 'px';

      setTimeout(() => {
        const distance = Math.hypot(defX - cpuTargetX, defY - cpuTargetY);
        
        if (distance < 50) {
          alert('DEFESAÇO! Você salvou o gol! 🧤');
        } else {
          cpuScore++;
          alert('GOL DA CPU! ⚽');
        }

        mode = 'SHOOT';
        round++;
        startTurn();
      }, 600);
    }

    function endGame() {
      let finalMsg = playerScore > cpuScore 
        ? `PARABÉNS! A seleção de ${playerTeam} VENCEU! 🏆` 
        : playerScore < cpuScore 
        ? `FIM DE JOGO! A seleção de ${cpuTeam} VENCEU! 😢` 
        : 'FIM DE JOGO! Empate!';

      document.getElementById('info-turno').innerText = finalMsg;
      document.getElementById('btn-restart').style.display = 'inline-block';
    }

    function restartGame() {
      playerScore = 0;
      cpuScore = 0;
      round = 1;
      mode = 'SHOOT';
      document.getElementById('btn-restart').style.display = 'none';
      document.getElementById('screen-select').style.display = 'block';
      document.getElementById('game-container').style.display = 'none';
    }
  </script>
</body>
</html>
