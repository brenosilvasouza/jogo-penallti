<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disputa de Pênaltis</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  text-align: center;
  color: white;
  background: #10251b;
}

h1 { color: #ffe45c; }

#campo {
  position: relative;
  width: min(92%, 500px);
  height: 300px;
  margin: 20px auto;
  overflow: hidden;
  border: 4px solid white;
  border-radius: 8px;
  background: repeating-linear-gradient(
    0deg, #218c45, #218c45 60px,
    #197a39 60px, #197a39 120px
  );
}

#gol {
  position: absolute;
  top: 15px;
  left: 20%;
  width: 60%;
  height: 105px;
  border: 5px solid white;
  background:
    repeating-linear-gradient(90deg, transparent 0 19px,
      #ffffff55 20px 22px),
    repeating-linear-gradient(0deg, transparent 0 19px,
      #ffffff55 20px 22px);
}

#goleiro {
  position: absolute;
  top: 70px;
  left: 46%;
  font-size: 45px;
  transition: all 0.4s;
}

#bola {
  position: absolute;
  bottom: 30px;
  left: 47%;
  font-size: 32px;
  transition: all 0.5s;
}

#mensagem {
  min-height: 28px;
  font-size: 20px;
  font-weight: bold;
}

button {
  margin: 5px;
  padding: 12px 16px;
  border: none;
  border-radius: 8px;
  background: #ffe45c;
  color: #172016;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.45;
}

#placar {
  font-size: 20px;
  line-height: 1.8;
}

</style>
</head>

<body>

<h1>⚽ DISPUTA DE PÊNALTIS</h1>
<p>Escolha o canto e tente marcar o gol!</p>

<div id="placar">
  Você: <span id="meusGols">0</span> |
  Goleiro: <span id="defesas">0</span>
  <br>
  Cobrança: <span id="rodada">1</span>/5
</div>

<div id="campo">
  <div id="gol"></div>
  <div id="goleiro">🧤</div>
  <div id="bola">⚽</div>
</div>

<div id="mensagem">Prepare-se para cobrar!</div>

<div id="controles">
  <button onclick="chutar('esquerda')">⬅ Esquerda</button>
  <button onclick="chutar('centro')">⬆ Centro</button>
  <button onclick="chutar('direita')">Direita ➡</button>
</div>

<button onclick="reiniciar()">🔄 Jogar novamente</button>

<script>
let gols = 0;
let defesas = 0;
let rodada = 1;
let jogando = false;
let finalizado = false;

function chutar(canto) {
  if (jogando || finalizado) return;

  jogando = true;

  const goleiro = document.getElementById("goleiro");
  const bola = document.getElementById("bola");
  const mensagem = document.getElementById("mensagem");

  const lados = ["esquerda", "centro", "direita"];
  const defesa = lados[Math.floor(Math.random() * 3)];

  const posicoes = {
    esquerda: { bola: "25%", goleiro: "22%" },
    centro:   { bola: "47%", goleiro: "46%" },
    direita:  { bola: "70%", goleiro: "70%" }
  };

  bola.style.left = posicoes[canto].bola;
  bola.style.bottom = "175px";
  goleiro.style.left = posicoes[defesa].goleiro;

  if (canto === defesa) {
    defesas++;
    mensagem.textContent = "🧤 DEFENDEU! O goleiro pegou!";
  } else {
    gols++;
    mensagem.textContent = "⚽ GOOOOOL! Você marcou!";
  }

  document.getElementById("meusGols").textContent = gols;
  document.getElementById("defesas").textContent = defesas;

  document.querySelectorAll("#controles button")
    .forEach(botao => botao.disabled = true);

  setTimeout(() => {
    rodada++;
    document.getElementById("rodada").textContent =
      Math.min(rodada, 5);

    if (rodada > 5) {
      finalizado = true;

      if (gols > 5 - defesas) {
        mensagem.textContent = "🏆 Você venceu a disputa!";
      } else if (gols === 5 - defesas) {
        mensagem.textContent = "🤝 Empate! Fim da disputa!";
      } else {
        mensagem.textContent = "😢 Você perdeu! Tente novamente!";
      }

      document.getElementById("controles").style.display = "none";
    } else {
      bola.style.left = "47%";
      bola.style.bottom = "30px";
      goleiro.style.left = "46%";
      mensagem.textContent = "Próxima cobrança! Escolha o canto.";
      document.querySelectorAll("#controles button")
        .forEach(botao => botao.disabled = false);
      jogando = false;
    }
  }, 1000);
}

function reiniciar() {
  gols = 0;
  defesas = 0;
  rodada = 1;
  jogando = false;
  finalizado = false;

  document.getElementById("meusGols").textContent = 0;
  document.getElementById("defesas").textContent = 0;
  document.getElementById("rodada").textContent = 1;
  document.getElementById("mensagem").textContent =
    "Prepare-se para cobrar!";

  document.getElementById("bola").style.cssText = "";
  document.getElementById("goleiro").style.cssText = "";
  document.getElementById("controles").style.display = "block";

  document.querySelectorAll("#controles button")
    .forEach(botao => botao.disabled = false);
}
</script>

</body>
</html>
