<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disputa de Pênaltis</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      color: white;
      background: #0f172a;
      user-select: none;
    }

    h1 { margin: 15px 0 5px; color: #fbbf24; text-shadow: 2px 2px 4px #000; }

    #screen-select, #game-container {
      max-width: 650px;
      margin: 0 auto;
      padding: 10px;
    }

    .team-btn {
      padding: 12px 25px;
      font-size: 18px;
      margin: 10px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .btn-br { background: #facc15; color: #1e3a8a; }
    .btn-arg { background: #38bdf8; color: #ffffff; }

    /* Estádio e Campo estilo Cartoon */
    #estadio {
      position: relative;
      width: 100%;
      height: 400px;
      background: linear-gradient(to bottom, #334155 0%, #1e293b 35%, #4ac05d 35%, #2ea043 100%);
      border: 4px solid #ffffff;
      border-radius: 12px;
      overflow: hidden;
      cursor: crosshair;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }

    /* Arquibancada no fundo */
    .crowd {
      position: absolute;
      top: 0;
      width: 100%;
      height: 35%;
      background: radial-gradient(circle, #475569 20%, transparent 20%), #1e293b;
      background-size: 10px 10px;
      opacity: 0.8;
    }

    .placa-publicidade {
      position: absolute;
      top: 32%;
      width: 100%;
      height: 12px;
      background: #94a3b8;
      border-top: 2px solid #64748b;
    }

    /* Baliza em 3D */
    #gol-area {
      position: absolute;
      top: 15%;
      left: 15%;
      width: 70%;
      height: 120px;
      border: 6px solid #ffffff;
      border-bottom: none;
      background-image: 
        linear-gradient(to right, rgba(255,255,255,0.3) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.3) 1px, transparent 1px);
      background-size: 12px 12px;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
    }

    /* Linhas do Campo */
    .linha-grande-area {
      position: absolute;
      top: 45%;
      left: 5%;
      width: 90%;
      height: 2px;
      background: rgba(255,255,255,0.8);
    }

    .linha-penalti {
      position: absolute;
      bottom: 25%;
      left: 10%;
      width: 80%;
      height: 2px;
      background: rgba(255,255,255,0.8);
    }

    /* Ponto de Mira (Red Target) */
    #target {
      position: absolute;
      width: 16px;
      height: 16px;
      background: #ef4444;
      border: 2px solid #ffffff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      display: none;
      z-index: 10;
    }

    /* Personagens */
    #goleiro {
      position: absolute;
      top: 28%;
      left: 50%;
      width: 40px;
      height: 60px;
      transform: translateX(-50%);
      transition: all 0.4s ease;
      z-index: 5;
    }

    /* Ilustração de Goleiro em CSS */
    .goleiro-body {
      width: 100%;
      height: 100%;
      background: #3b82f6;
      border-radius: 8px 8px 0 0;
      position: relative;
    }
    .goleiro-head {
      position: absolute;
      top: -15px;
      left: 10px;
      width: 20px;
      height: 20px;
      background: #fca5a5;
      border-radius: 50%;
    }

    #batedor {
      position: absolute;
      bottom: 5%;
      left: 50%;
      width: 44px;
      height: 70px;
      transform: translateX(-50%);
      z-index: 5;
    }

    .batedor-body {
      width: 100%;
      height: 100%;
      background: #ef4444;
      border-radius: 10px 10px 0 0;
      position: relative;
    }
    .batedor-head {
      position: absolute;
      top: -16px;
      left: 12px;
      width: 20px;
      height: 20px;
      background: #fde047;
      border-radius: 50%;
    }

    /* Bola */
    #bola {
      position: absolute;
      bottom: 22%;
      left: 50%;
      width: 20px;
      height: 20px;
      background: #ffffff;
      border: 2px solid #000000;
      border-radius: 50%;
      transform: translateX(-50%);
      transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
      z-index: 6;
    }

    /* Barra de Medição de Força */
    #power-box {
      width: 80%;
      height: 18px;
      background: #1e293b;
      border: 2px solid #ffffff;
      margin: 10px auto;
      border-radius: 10px;
      overflow: hidden;
    }

    #power-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(to right, #22c55e, #eab308, #ef4444);
    }

    .btn-action {
      background: #facc15;
      color: #0f172a;
      border: none;
      padding: 10px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>⚽ DISPUTA DE PÊNALTIS</h1>

  <div id="screen-select">
    <h2>Escolha a sua Seleção:</h2>
    <button class="team-btn btn-br" onclick="selectTeam('Brasil')">🇧🇷 BRASIL</button>
    <button class="team-btn btn-arg" onclick="selectTeam('Argentina')">🇦🇷 ARGENTINA</button>
  </div>

  <div id="game-container" style="display: none;">
    <h3 id="info-placar">Você: 0 | CPU: 0</h3>
    <h4 id="info-turno">Sua vez de BATER!</h4>

    <div id="estadio" onclick="handleClickCampo(event)">
      <div class="crowd"></div>
      <div class="placa-publicidade"></div>
      <div id="gol-area"></div>
      <div class="linha-grande-area"></div>
      <div class="linha-penalti"></div>

      <!-- Alvo/Mira -->
      <div id="target"></div>

      <!-- Goleiro -->
      <div id="goleiro">
        <div class="goleiro-head"></div>
        <div class="goleiro-body" id="goleiro-camisa"></div>
      </div>

      <!-- Bola -->
      <div id="bola"></div>

      <!-- Batedor -->
      <div id="batedor">
        <div class="batedor-head"></div>
        <div class="batedor-body" id="batedor-camisa"></div>
      </div>
    </div>

    <p id="label-forca">1. Clique na baliza para mirar.</p>
    <div id="power-box">
      <div id="power-bar"></div>
    </div>

    <button id="btn-restart" class="btn-action" style="display:none;" onclick="restartGame()">Jogar Novamente</button>
  </div>

  <script>
    let playerTeam = '';
    let cpuTeam = '';
    let playerScore = 0;
    let cpuScore = 0;
    let round = 1;
    let maxRounds = 5;
    let mode = 'SHOOT';

    let power = 0;
    let powerIncreasing = true;
    let powerInterval = null;
    let targetX = 0, targetY = 0;
    let canAction = false;

    function selectTeam(team) {
      playerTeam = team;
      cpuTeam = team === 'Brasil' ? 'Argentina' : 'Brasil';
      
      document.getElementById('screen-select').style.display = 'none';
      document.getElementById('game-container').style.display = 'block';

      // Cores das camisas
      document.getElementById('batedor-camisa').style.background = team === 'Brasil' ? '#facc15' : '#38bdf8';
      document.getElementById('goleiro-camisa').style.background = team === 'Brasil' ? '#38bdf8' : '#facc15';

      startTurn();
    }

    function updateUI() {
      document.getElementById('info-placar').innerText = `${playerTeam}: ${playerScore} | ${cpuTeam}: ${cpuScore} (Rodada ${round}/${maxRounds})`;
    }

    function startTurn() {
      updateUI();
      resetPositions();

      if (round > maxRounds) {
        endGame();
        return;
      }

      if (mode === 'SHOOT') {
        document.getElementById('info-turno').innerText = `Sua vez de BATER (${playerTeam})!`;
        document.getElementById('label-forca').innerText = '1. Clique na baliza para fixar a mira.';
        document.getElementById('batedor').style.display = 'block';
        canAction = true;
      } else {
        document.getElementById('info-turno').innerText = `Sua vez de DEFENDER (${playerTeam})!`;
        document.getElementById('label-forca').innerText = 'Clique no local da baliza onde deseja saltar!';
        document.getElementById('batedor').style.display = 'none';
        canAction = true;
      }
    }

    function resetPositions() {
      const bola = document.getElementById('bola');
      const goleiro = document.getElementById('goleiro');
      const target = document.getElementById('target');

      bola.style.transition = 'all 0.5s cubic-bezier(0.25, 1, 0.5, 1)';
      bola.style.bottom = '22%';
      bola.style.left = '50%';
      bola.style.transform = 'translateX(-50%) scale(1)';

      goleiro.style.left = '50%';
      goleiro.style.top = '28%';

      target.style.display = 'none';

      clearInterval(powerInterval);
      powerInterval = null;
      power = 0;
      document.getElementById('power-bar').style.width = '0%';
    }

    function startPowerMeter() {
      powerInterval = setInterval(() => {
        if (powerIncreasing) {
          power += 5;
          if (power >= 100) powerIncreasing = false;
        } else {
          power -= 5;
          if (power <= 0) powerIncreasing = true;
        }
        document.getElementById('power-bar').style.width = power + '%';
      }, 25);
    }

    function handleClickCampo(event) {
      if (!canAction) return;

      const estadio = document.getElementById('estadio');
      const rect = estadio.getBoundingClientRect();
      const clickX = event.clientX - rect.left;
      const clickY = event.clientY - rect.top;

      if (mode === 'SHOOT') {
        if (!powerInterval) {
          // Fixar a mira (Red Target)
          targetX = clickX;
          targetY = clickY;

          const target = document.getElementById('target');
          target.style.left = targetX + 'px';
          target.style.top = targetY + 'px';
          target.style.display = 'block';

          startPowerMeter();
          document.getElementById('label-forca').innerText = '2. Clique novamente para definir a força e chutar!';
        } else {
          // Confirmar Força e Chutar
          clearInterval(powerInterval);
          canAction = false;
          executePlayerShot();
        }
      } else if (mode === 'DEFEND') {
        canAction = false;
        executePlayerDefense(clickX, clickY);
      }
    }

    function executePlayerShot() {
      const bola = document.getElementById('bola');
      const goleiro = document.getElementById('goleiro');

      // Movimento da Bola
      bola.style.left = targetX + 'px';
      bola.style.top = targetY + 'px';
      bola.style.transform = 'scale(0.6)';

      // Movimento aleatório do goleiro
      const cpuMoveX = Math.random() * 200 + 200; // Área do gol
      goleiro.style.left = cpuMoveX + 'px';

      setTimeout(() => {
        const isGoal = Math.abs(power - 70) < 35 && Math.abs(targetX - cpuMoveX) > 40;

        if (isGoal) {
          playerScore++;
          alert('GOLAZO! ⚽');
        } else {
          alert('DEFENDEU O GOLEIRO / PARA FORA! ❌');
        }

        mode = 'DEFEND';
        startTurn();
      }, 600);
    }

    function executePlayerDefense(defX, defY) {
      const goleiro = document.getElementById('goleiro');
      const bola = document.getElementById('bola');

      // Mover o goleiro para a posição escolhida pelo jogador
      goleiro.style.left = defX + 'px';
      goleiro.style.top = defY + 'px';

      // Chute da CPU
      const cpuTargetX = Math.random() * 220 + 210;
      const cpuTargetY = Math.random() * 70 + 80;

      bola.style.left = cpuTargetX + 'px';
      bola.style.top = cpuTargetY + 'px';
      bola.style.transform = 'scale(0.6)';

      setTimeout(() => {
        const distance = Math.hypot(defX - cpuTargetX, defY - cpuTargetY);

        if (distance < 50) {
          alert('DEFESAÇO! Salvou o gol! 🧤');
        } else {
          cpuScore++;
          alert('GOL DA CPU! ⚽');
        }

        mode = 'SHOOT';
        round++;
        startTurn();
      }, 600);
    }

    function endGame() {
      let msg = playerScore > cpuScore 
        ? `PARABÉNS! ${playerTeam} Venceu a partida! 🏆` 
        : playerScore < cpuScore 
        ? `FIM DE JOGO! ${cpuTeam} Venceu! 😢` 
        : 'FIM DE JOGO! Empate!';

      document.getElementById('info-turno').innerText = msg;
      document.getElementById('btn-restart').style.display = 'inline-block';
    }

    function restartGame() {
      playerScore = 0;
      cpuScore = 0;
      round = 1;
      mode = 'SHOOT';
      document.getElementById('btn-restart').style.display = 'none';
      document.getElementById('screen-select').style.display = 'block';
      document.getElementById('game-container').style.display = 'none';
    }
